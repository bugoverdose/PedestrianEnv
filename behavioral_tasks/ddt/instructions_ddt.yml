intro: |
  실험에 참여해주시어 감사합니다.

  실험자의 지시에 따라 다음 화면으로 진행하겠습니다.

train_before:
- >
  당신은 본 실험에서 서로 다른 기간 후에 얻을 수 있는 두 보상 중에서 하나를
  선택하게 됩니다. 한번의 게임은 {}번의 시행으로 구성되며, 각 시행에서는
  아래와 같이 두 개의 선택지가 제시되고 그 중 하나를 선택하게 됩니다.
- >
  어느 쪽을 더 선호하는지에 따라서 <S> 혹은 <L>를
  눌러 선호하는 선택지를 선택하여 주십시오.
- >
  본 게임에서 어느 것을 선택해야 하는지에 정답은 없으며, 최대한 본인이 더 선호하는
  선택지를 고르도록 노력하여 주십시오.
- >
  게임에 대한 설명을 잘 이해하셨는지를 확인하기 위하여 짧은 연습 게임을 수행하겠습니다.

train_after: |
  연습 게임이 종료되었습니다.

  이해되지 않은 부분이 있다면 실험자에게 질문하여 주십시오.

main_before: |
  본 게임을 시작하겠습니다.

  게임은 총 {}번의 시행으로 구성되어 있습니다.

  로딩에 5초 이상 소요되는 경우 스페이스바를 다시 눌러주시기 바랍니다.

main_after: |
  본 게임이 종료되었습니다.
  
  실험자의 지시에 따라 다음 화면으로 진행하겠습니다. 

outro: |
  게임을 모두 마치셨습니다.

  참여해주시어 대단히 감사드립니다.
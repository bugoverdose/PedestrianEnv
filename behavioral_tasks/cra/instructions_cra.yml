intro: |
  실험에 참여해주셔서 감사합니다.

  실험자의 지시에 따라 다음 화면으로 진행하겠습니다.

train_before:
- > # 0) 게임에 대한 설명
  당신은 본 실험에서 보상을 얻을 수 있는 두 선택지 중 하나를 택하는 게임을 수행하게 됩니다.
  한 번의 게임은 여러 번의 시행으로 구성되어 있으며, 각 시행에서는 다음과 같이 두 가지 상자가 선택지로 제시됩니다.
- > # 1) 보상에 대한 설명
  선택을 하시면 선택하신 상자에서 칩을 하나 뽑게 됩니다. 상자에는 빨간 부분의 비율만큼 빨간색 칩이, 파란 부분의 비율만큼 파란색 칩이 들어있습니다.
  어떤 색의 칩이 나올지는 색깔의 비율에 따라 무작위로 정해집니다. 
  각 선택지의 상단에는 빨간색 칩을 뽑았을 때의 보상이, 하단에는 파란색 칩을 뽑았을 때의 보상이 쓰여져 있습니다.
- > # 2) 박스에 대한 설명 - Risky trial
  각 시행마다 빨간색이나 파란색 둘 중 하나의 칩만이 보상을 주고, 다른 한쪽은 보상이 0으로 표시됩니다.
  즉, 빨간 칩이 보상을 줄 때는 빨간 부분만큼의 확률로, 파란 칩이 보상을 줄 때는 파란 부분만큼의 확률로 보상을 얻을 수 있습니다.
- > # 3) 박스에 대한 설명 - Ambiguous trial
  그러나 때때로 빨간색과 파란색 부분의 경계선이 회색 박스로 가려지기도 합니다.
  이 때, 빨간색과 파란색 부분의 비율은 회색 박스로 가려진 영역에서 무작위로 선택됩니다.
- > # 4) 선택에 대한 설명
  한 시행에서 선택지가 제시되면 1초 동안은 버튼을 눌러도 선택을 할 수 없습니다.
  이 시간 동안 선택지들을 살펴보신 뒤에 선택지의 색이 밝아지면 하나를 선택하십시오.
  선택은 <S> (왼쪽) 혹은 <L> (오른쪽) 키를 누르시어 선택하시면 됩니다.
- > # 5) 보상에 대한 설명
  각 시행의 결과는 바로 보여지지는 않으나, 선택에 따라서 확률적으로 보상이 선택됩니다.
  본 게임에서 정답은 없으며, 최대의 보상을 획득하는 것을 목표로 게임을 진행하시면 됩니다.
- > # 6) 연습 게임 설명
  게임에 대한 설명을 잘 이해하셨는지를 확인하기 위하여 짧은 연습 게임을 수행하겠습니다.
  게임을 잘 이해하셨는지를 확인하기 위한 목적이기 때문에 가급적 최선을 다 해주시기를 부탁드립니다.

train_after: |
  연습 게임이 종료되었습니다.

  이해되지 않은 부분이 있다면 실험자에게 질문하여 주십시오.

main_before: |
  본 게임을 시작하겠습니다.

  게임은 총 {}번의 시행으로 구성되어 있습니다.

  로딩에 5초 이상 소요되는 경우 스페이스바를 다시 눌러주시기 바랍니다.

main_after: |
  본 게임이 종료되었습니다.
  
outro: |
  게임을 모두 마치셨습니다.

  참여해주시어 대단히 감사드립니다.
name: pedestrian_analysis_gpu # ccsl3
channels:
  - conda-forge
  - nvidia
  - pytorch
dependencies:
  - python==3.9.7
  - pygame==2.1.3
  - numpy==1.24.1
  - pandas==1.3.4
  - matplotlib==3.4.3
  - scipy==1.7.3
  - scikit-learn=1.6.1
  - seaborn==0.13.2
  - yellowbrick==1.5
  - kneed==0.8.5
  - ipykernel
  - pyarrow==19.0.0
  # GPU support
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pip
  - pip:
      - gymnasium==0.29.1
      - tensorboard==2.15.2 # run `tensorboard --logdir=./tb_logs/`
      - stable-baselines3==2.2.1 # DQN # requirements: gymnasium>=0.28.1,<0.30
      - imitation==1.0.1 # AIRL # requirements: gymnasium~=0.29, stable-baselines3~=2.2.1
      - ray==2.11.0
      - tensorflow==2.15.0
      - protobuf==3.20.3
      - absl-py==1.4.0
  